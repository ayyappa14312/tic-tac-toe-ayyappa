<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Game Mode Selection Modal -->
    <div class="modal" id="gameModeModal">
        <div class="modal-content">
            <h2><i class="fas fa-chess"></i> Chess Game</h2>
            <p>Select your game mode</p>
            <button id="twoPlayerBtn" class="btn primary-btn">
                <i class="fas fa-users"></i> Two Players
            </button>
            <button id="computerPlayerBtn" class="btn secondary-btn">
                <i class="fas fa-robot"></i> Play vs Computer
            </button>
        </div>
    </div>

    <!-- Difficulty Selection Modal -->
    <div class="modal" id="difficultyModal">
        <div class="modal-content">
            <h2><i class="fas fa-brain"></i> Select Difficulty</h2>
            <button id="easyBtn" class="btn difficulty-btn easy">
                <i class="fas fa-star"></i> Easy
            </button>
            <button id="mediumBtn" class="btn difficulty-btn medium">
                <i class="fas fa-star"></i><i class="fas fa-star"></i> Medium
            </button>
            <button id="hardBtn" class="btn difficulty-btn hard">
                <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i> Hard
            </button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2 id="gameOverMessage"><i class="fas fa-trophy"></i> Checkmate!</h2>
            <p id="gameOverDetails">White wins!</p>
            <button id="newGameBtn" class="btn primary-btn">
                <i class="fas fa-redo"></i> New Game
            </button>
            <button id="rematchBtn" class="btn secondary-btn">
                <i class="fas fa-exchange-alt"></i> Rematch
            </button>
        </div>
    </div>

    <!-- Main Game Container -->
    <div class="game-container" id="gameContainer">
        <!-- Game Header -->
        <div class="game-header">
            <div class="player-info white-player">
                <div class="player-avatar">
                    <i class="fas fa-chess-king"></i>
                </div>
                <div class="player-details">
                    <h3>White</h3>
                    <div class="timer" id="whiteTimer">10:00</div>
                </div>
            </div>
            
            <div class="game-controls">
                <button id="undoBtn" class="control-btn" title="Undo Move">
                    <i class="fas fa-undo"></i>
                </button>
                <button id="flipBtn" class="control-btn" title="Flip Board">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button id="resetBtn" class="control-btn" title="New Game">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
            
            <div class="player-info black-player">
                <div class="player-avatar">
                    <i class="fas fa-chess-king"></i>
                </div>
                <div class="player-details">
                    <h3>Black</h3>
                    <div class="timer" id="blackTimer">10:00</div>
                </div>
            </div>
        </div>

        <!-- Chess Board -->
        <div class="chess-board" id="chessBoard">
            <!-- Board will be generated by JavaScript -->
        </div>

        <!-- Game Sidebar -->
        <div class="game-sidebar">
            <div class="move-history">
                <h3><i class="fas fa-history"></i> Move History</h3>
                <div class="moves-container" id="movesContainer">
                    <!-- Moves will be added here -->
                </div>
            </div>
            
            <div class="captured-pieces">
                <h3><i class="fas fa-chess-pawn"></i> Captured Pieces</h3>
                <div class="captured-white" id="capturedWhite">
                    <!-- Captured white pieces -->
                </div>
                <div class="captured-black" id="capturedBlack">
                    <!-- Captured black pieces -->
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="moveSound" src="sounds/move.mp3"></audio>
    <audio id="captureSound" src="sounds/capture.mp3"></audio>
    <audio id="checkSound" src="sounds/check.mp3"></audio>
    <audio id="checkmateSound" src="sounds/checkmate.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
